version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baazarsetu
      POSTGRES_PASSWORD: baazarsetu_pass
      POSTGRES_DB: baazarsetu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  baazarsetu-node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://baazarsetu:baazarsetu_pass@postgres:5432/baazarsetu_db
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://baazarsetu-ai:8000
    depends_on:
      - postgres
      - redis

  baazarsetu-ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    ports:
      - "8000:8000"

volumes:
  postgres_data:
